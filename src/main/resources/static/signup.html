<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register an account on the HelpDesk SaaS Platform. Connect with a company and access support ticketing services.">
    <title>Sign Up - HelpDesk Pro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (Relative path) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Theme Toggle Floating Button -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button id="themeToggleBtn" class="btn btn-outline-secondary rounded-circle" style="width: 40px; height: 40px; padding: 0; line-height: 38px;">🌙</button>
    </div>

    <!-- Auth Container -->
    <div class="auth-wrapper">
        <div class="card premium-card auth-card fade-in-up" id="signupCard">
            <h1 class="brand-title">HelpDesk Pro</h1>
            <p class="text-center text-secondary mb-4">Create your account</p>
            
            <form id="signupForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                    <label for="fullName">Full Name</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">Email Address</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password (min 6 chars)</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="phone" placeholder="Phone Number">
                    <label for="phone">Phone Number</label>
                </div>

                <div class="form-floating mb-4">
                    <select class="form-select" id="companyId" required>
                        <option value="" disabled selected>Select Company</option>
                        <!-- Options will be populated dynamically -->
                    </select>
                    <label for="companyId">Associated Company</label>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 mb-3">Create Account</button>
            </form>

            <p class="text-center mb-0 text-secondary">
                Already have an account? <a href="login.html" class="text-decoration-none" style="color: var(--accent-color);">Sign In</a>
            </p>
        </div>
    </div>

    <!-- Loader Wrapper -->
    <div id="loaderWrapper" class="loader-wrapper">
        <div class="spinner-premium"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Scripts (Relative paths) -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Load companies dynamically from API
        async function loadCompanies() {
            try {
                // In Phase 1, we can call the endpoint. If empty, we populate with placeholders.
                const selectElement = document.getElementById('companyId');
                const response = await apiRequest('/companies/all').catch(() => null);
                
                if (response && response.success && response.data && response.data.length > 0) {
                    response.data.forEach(company => {
                        const option = document.createElement('option');
                        option.value = company.id;
                        option.textContent = company.name;
                        selectElement.appendChild(option);
                    });
                } else {
                    // Fallback placeholders for Phase 1 testing
                    const placeholders = [
                        { id: 1, name: "TechNova Solutions" },
                        { id: 2, name: "InnoSoft Corp" }
                    ];
                    placeholders.forEach(company => {
                        const option = document.createElement('option');
                        option.value = company.id;
                        option.textContent = company.name;
                        selectElement.appendChild(option);
                    });
                }
            } catch (err) {
                console.error("Error loading companies list", err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadCompanies);

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            const companyId = document.getElementById('companyId').value;
            handleRegister(fullName, email, password, phone, companyId);
        });
    </script>
</body>
</html>
