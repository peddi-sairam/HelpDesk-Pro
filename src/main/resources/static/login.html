<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login page for the Enterprise HelpDesk SaaS Platform. Connect with support or manage service requests.">
    <title>Login - Enterprise HelpDesk</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (Relative path without leading slash) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Theme Toggle Floating Button -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button id="themeToggleBtn" class="btn btn-outline-secondary rounded-circle" style="width: 40px; height: 40px; padding: 0; line-height: 38px;">🌙</button>
    </div>

    <!-- Auth Container -->
    <div class="auth-wrapper">
        <div class="card premium-card auth-card fade-in-up" id="loginCard">
            <h1 class="brand-title">HelpDesk Pro</h1>
            <p class="text-center text-secondary mb-4">Enterprise SaaS Platform</p>
            
            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">Email Address</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="text-decoration-none" style="color: var(--accent-color);" onclick="showToast('Forgot password logic is implemented in Phase 2.', 'info')">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 mb-3">Sign In</button>
            </form>

            <p class="text-center mb-0 text-secondary">
                Don't have an account? <a href="signup.html" class="text-decoration-none" style="color: var(--accent-color);">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Loader Wrapper -->
    <div id="loaderWrapper" class="loader-wrapper">
        <div class="spinner-premium"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Scripts (Relative paths without leading slash) -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            handleLogin(email, password);
        });
    </script>
</body>
</html>
