# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration
# Base64 encoded secret key (512-bit safe key for HS512)
app.jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1hbmQtbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1zcHJpLWJvb3Qtc2Fhcy1oZWxwZGVzaw==
# JWT Access Token expiration: 24 hours in milliseconds (1000 * 60 * 60 * 24)
app.jwt.expiration-ms=86400000
# JWT Refresh Token expiration: 7 days in milliseconds (1000 * 60 * 60 * 24 * 7)
app.jwt.refresh-expiration-ms=604800000

# Swagger OpenAPI Custom Path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security configurations for static resource serving
spring.mvc.static-path-pattern=/**
